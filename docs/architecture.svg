<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-labelledby="title desc">
  <title id="title">How build-report works</title>
  <desc id="desc">From the input folder through discover, the template reader, the resolver and the long records to the metrics engine, the workbook writer, the reproducible save, the notifier, the manifest and the output folder; below, the GitHub Actions path from weekly-report.yml to the Pages site.</desc>
  <style>
    .bg { fill: #0B0F14; }
    .box { fill: #182130; stroke: #5A6A7D; stroke-width: 1.5; }
    .box-side { fill: #182130; stroke: #93A1B0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .box-ci { fill: #121820; stroke: #93A1B0; stroke-width: 1.5; }
    .label { fill: #E6EDF3; font: 600 13px "Segoe UI", "Inter", Arial, sans-serif; }
    .sub { fill: #93A1B0; font: 13px Consolas, "JetBrains Mono", "DejaVu Sans Mono", monospace; }
    .group { fill: #93A1B0; font: 600 12px Consolas, "JetBrains Mono", "DejaVu Sans Mono", monospace; letter-spacing: .06em; }
    .edge { fill: none; stroke: #93A1B0; stroke-width: 1.5; }
    .edge-side { fill: none; stroke: #93A1B0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #93A1B0; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="bg" x="0" y="0" width="1000" height="364"/>
  <rect class="box-side" x="11" y="24" width="148" height="72" rx="8"/><text class="label" x="85" y="49" text-anchor="middle">Generator</text><text class="sub" x="85" y="68" text-anchor="middle">generate-fixtures</text>
  <rect class="box" x="177" y="24" width="148" height="72" rx="8"/><text class="label" x="251" y="49" text-anchor="middle">Input folder</text><text class="sub" text-anchor="middle"><tspan x="251" y="68">12 workbooks</tspan><tspan x="251" y="85">a week</tspan></text>
  <rect class="box" x="343" y="24" width="148" height="72" rx="8"/><text class="label" x="417" y="49" text-anchor="middle">Discover</text><text class="sub" x="417" y="68" text-anchor="middle">*.xlsx by name</text>
  <rect class="box" x="509" y="24" width="148" height="72" rx="8"/><text class="label" x="583" y="49" text-anchor="middle">Template reader</text><text class="sub" text-anchor="middle"><tspan x="583" y="68">per file,</tspan><tspan x="583" y="85">findings</tspan></text>
  <rect class="box" x="675" y="24" width="148" height="72" rx="8"/><text class="label" x="749" y="49" text-anchor="middle">Resolver</text><text class="sub" x="749" y="68" text-anchor="middle">weeks, duplicates</text>
  <rect class="box" x="841" y="24" width="148" height="72" rx="8"/><text class="label" x="915" y="49" text-anchor="middle">Long records</text><text class="sub" text-anchor="middle"><tspan x="915" y="68">one row per</tspan><tspan x="915" y="85">measure</tspan></text>
  <line class="edge-side" x1="159" y1="60" x2="177" y2="60" marker-end="url(#arrow)"/>
  <line class="edge" x1="325" y1="60" x2="343" y2="60" marker-end="url(#arrow)"/>
  <line class="edge" x1="491" y1="60" x2="509" y2="60" marker-end="url(#arrow)"/>
  <line class="edge" x1="657" y1="60" x2="675" y2="60" marker-end="url(#arrow)"/>
  <line class="edge" x1="823" y1="60" x2="841" y2="60" marker-end="url(#arrow)"/>
  <path class="edge" d="M915 96V120H85V144" marker-end="url(#arrow)"/>
  <rect class="box" x="11" y="144" width="148" height="72" rx="8"/><text class="label" x="85" y="169" text-anchor="middle">Metrics engine</text><text class="sub" x="85" y="188" text-anchor="middle">report.yaml</text>
  <rect class="box" x="177" y="144" width="148" height="72" rx="8"/><text class="label" x="251" y="169" text-anchor="middle">Workbook writer</text><text class="sub" text-anchor="middle"><tspan x="251" y="188">five sheets,</tspan><tspan x="251" y="205">charts</tspan></text>
  <rect class="box" x="343" y="144" width="148" height="72" rx="8"/><text class="label" x="417" y="169" text-anchor="middle">Reproducible save</text><text class="sub" x="417" y="188" text-anchor="middle">SOURCE_DATE_EPOCH</text>
  <rect class="box" x="509" y="144" width="148" height="72" rx="8"/><text class="label" x="583" y="169" text-anchor="middle">Notifier</text><text class="sub" x="583" y="188" text-anchor="middle">.eml or SMTP</text>
  <rect class="box" x="675" y="144" width="148" height="72" rx="8"/><text class="label" x="749" y="169" text-anchor="middle">Manifest</text><text class="sub" x="749" y="188" text-anchor="middle">always written</text>
  <rect class="box" x="841" y="144" width="148" height="72" rx="8"/><text class="label" x="915" y="169" text-anchor="middle">Output folder</text><text class="sub" x="915" y="188" text-anchor="middle">xlsx, json, eml</text>
  <line class="edge" x1="159" y1="180" x2="177" y2="180" marker-end="url(#arrow)"/>
  <line class="edge" x1="325" y1="180" x2="343" y2="180" marker-end="url(#arrow)"/>
  <line class="edge" x1="491" y1="180" x2="509" y2="180" marker-end="url(#arrow)"/>
  <line class="edge" x1="657" y1="180" x2="675" y2="180" marker-end="url(#arrow)"/>
  <line class="edge" x1="823" y1="180" x2="841" y2="180" marker-end="url(#arrow)"/>
  <text class="group" x="11" y="260">IN GITHUB ACTIONS, MONDAYS 06:00 UTC</text>
  <rect class="box-ci" x="11" y="272" width="148" height="72" rx="8"/><text class="label" x="85" y="297" text-anchor="middle">weekly-report.yml</text><text class="sub" text-anchor="middle"><tspan x="85" y="316">schedule,</tspan><tspan x="85" y="333">dispatch</tspan></text>
  <rect class="box-ci" x="177" y="272" width="148" height="72" rx="8"/><text class="label" x="251" y="297" text-anchor="middle">build-report run</text><text class="sub" x="251" y="316" text-anchor="middle">the steps above</text>
  <rect class="box-ci" x="343" y="272" width="148" height="72" rx="8"/><text class="label" x="417" y="297" text-anchor="middle">web/latest/</text><text class="sub" x="417" y="316" text-anchor="middle">bot commit</text>
  <rect class="box-ci" x="509" y="272" width="148" height="72" rx="8"/><text class="label" x="583" y="297" text-anchor="middle">pages.yml</text><text class="sub" text-anchor="middle"><tspan x="583" y="316">LibreOffice</tspan><tspan x="583" y="333">render</tspan></text>
  <rect class="box-ci" x="675" y="272" width="148" height="72" rx="8"/><text class="label" x="749" y="297" text-anchor="middle">Pages site</text><text class="sub" x="749" y="316" text-anchor="middle">the demo page</text>
  <line class="edge" x1="159" y1="308" x2="177" y2="308" marker-end="url(#arrow)"/>
  <line class="edge" x1="325" y1="308" x2="343" y2="308" marker-end="url(#arrow)"/>
  <line class="edge" x1="491" y1="308" x2="509" y2="308" marker-end="url(#arrow)"/>
  <line class="edge" x1="657" y1="308" x2="675" y2="308" marker-end="url(#arrow)"/>
</svg>
