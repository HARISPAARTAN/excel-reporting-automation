[project]
name = "buildreport"
version = "0.1.0"
description = "Checks twelve weekly branch workbooks and builds one formatted Excel report, built and e-mailed on a schedule."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harithas Harikaran" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.2,<9",
    "openpyxl>=3.1.5,<3.2",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
build-report = "buildreport.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pandas>=2.2",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildreport"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "tools",
    "data",
    "docs",
    "report.yaml",
    "README.md",
    "README.de.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is the formatter's job; long messages and URLs stay unbroken.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["buildreport"]
known-local-folder = ["conftest", "helpers", "reference"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = [
    "src/buildreport/isoweek.py",
    "src/buildreport/expr.py",
    "src/buildreport/metrics.py",
    "src/buildreport/template.py",
    "src/buildreport/resolve.py",
    "src/buildreport/reproducible.py",
]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not render'"
markers = ["render: needs LibreOffice and poppler; runs only in the CI render job"]
