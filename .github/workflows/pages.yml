name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/render_sheets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install LibreOffice Calc, Carlito and poppler
        if: hashFiles('web/latest/Cedarline_Weekly_Report_*.xlsx') != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui fonts-crosextra-carlito poppler-utils
      - name: Render the sheet previews
        if: hashFiles('web/latest/Cedarline_Weekly_Report_*.xlsx') != ''
        run: uv run python tools/render_sheets.py web/latest/Cedarline_Weekly_Report_*.xlsx --out web/latest/preview
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
